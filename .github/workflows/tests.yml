name: Tests & Code Quality

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements-dev.txt 2>/dev/null || pip install pytest black pylint

    - name: Format check with Black
      run: |
        echo "Checking code formatting with Black..."
        black --check app/ tests/ 2>/dev/null || echo "Format check skipped (no app directory yet)"
      continue-on-error: true

    - name: Lint with Pylint
      run: |
        echo "Running Pylint..."
        pylint app/ --exit-zero --fail-under=8.0 2>/dev/null || echo "Lint check skipped (no app directory yet)"
      continue-on-error: true

    - name: Run tests with Pytest
      run: |
        echo "Running tests..."
        pytest --cov=app --cov-report=xml --cov-report=term 2>/dev/null || echo "Tests skipped (no tests yet)"
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Check for secrets
      run: |
        echo "Checking for secrets in code..."
        ! grep -r "\.env\|api_key\|secret\|password" app/ --include="*.py" | grep -v "\.env\.example" || echo "Warning: Possible secrets found in code"
      continue-on-error: true

    - name: Check for TODO comments
      run: |
        echo "Listing TODO comments:"
        grep -rn "TODO\|FIXME\|XXX\|HACK" app/ tests/ --include="*.py" || echo "No TODO comments found"
      continue-on-error: true
